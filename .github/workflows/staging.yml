name: Staging Deployment

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: "Deploy to server after Docker push"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  classify:
    name: Classify Tag
    runs-on: [self-hosted, linux, x64]
    outputs:
      tag_kind: ${{ steps.check.outputs.tag_kind }}
    steps:
      - name: Classify tag (case-insensitive)
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual dispatch — not a tag push. Treating as a staging-only run."
            echo "tag_kind=rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          LOWER=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')

          if [[ "$LOWER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "Tag '$TAG' matches RC pattern (vX.Y.Z-RCn). Staging only."
            echo "tag_kind=rc" >> "$GITHUB_OUTPUT"
          elif [[ "$LOWER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' matches release pattern (vX.Y.Z, no suffix). Staging + promote to production registry."
            echo "tag_kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG' does not match RC or release pattern. Pipeline will not run."
            echo "tag_kind=invalid" >> "$GITHUB_OUTPUT"
          fi

  trigger-integration-tests:
    name: Staging Unit Tests
    needs: [classify]
    uses: ./.github/workflows/staging-unit-test.yml
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_STAGING_BUILDS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}

  container_pipeline:
    name: Staging Container Pipeline
    needs: [classify, trigger-integration-tests]
    uses: ./.github/workflows/staging-ci.yml
    with:
      registry: docker.io
      image_repository: ${{ vars.DOCKERHUB_STAGING_IMAGE_REPOSITORY }}
      docker_context: .
      dockerfile: Dockerfile
      fail_on_gitleaks: true
      max_image_layers: 35
      max_image_size_mb: 3500
      push_image: true
    secrets:
      registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}

  deploy:
    name: Deploy To staging Server
    needs: [classify, trigger-integration-tests, container_pipeline]
    if: ${{ needs.container_pipeline.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_server)) }}
    uses: ./.github/workflows/deploy-server.yml
    with:
      server_host: ${{ vars.SERVER_HOST }}
      server_user: ${{ vars.SERVER_USER }}
      docker_compose_dir: "/home/iam01/inji-certify/docker-compose/docker-compose-injistack"
      docker_image: docker.io/${{ vars.DOCKERHUB_STAGING_IMAGE_REPOSITORY }}:${{ needs.container_pipeline.outputs.image_tag }}
      unit_test_status: "SKIPPED"
      docker_compose_file: "docker-compose.yaml"
      service_name: "certify"
      trivy_status: ${{ needs.container_pipeline.outputs.trivy_status }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_STAGING_BUILDS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}

  promote_to_production:
    name: Promote Release Image To Production Registry
    needs: [classify, container_pipeline]
    if: ${{ needs.classify.outputs.tag_kind == 'release' && needs.container_pipeline.result == 'success' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the image just built for staging
        run: |
          SRC_IMAGE="docker.io/${{ vars.DOCKERHUB_STAGING_IMAGE_REPOSITORY }}:${{ needs.container_pipeline.outputs.image_tag }}"
          echo "Pulling staging image: $SRC_IMAGE"
          docker pull "$SRC_IMAGE"

      - name: Tag and push to production registry (no rebuild, not deployed to prod yet)
        run: |
          SRC="docker.io/${{ vars.DOCKERHUB_STAGING_IMAGE_REPOSITORY }}:${{ needs.container_pipeline.outputs.image_tag }}"
          DEST="docker.io/${{ vars.DOCKERHUB_PRODUCTION_IMAGE_REPOSITORY }}:${{ needs.container_pipeline.outputs.image_tag }}"
          DEST_LATEST="docker.io/${{ vars.DOCKERHUB_PRODUCTION_IMAGE_REPOSITORY }}:latest"

          docker tag "$SRC" "$DEST"
          docker tag "$SRC" "$DEST_LATEST"

          docker push "$DEST"
          docker push "$DEST_LATEST"

      - name: Image cleanup
        if: always()
        run: |
          docker image rm "docker.io/${{ vars.DOCKERHUB_STAGING_IMAGE_REPOSITORY }}:${{ needs.container_pipeline.outputs.image_tag }}" || true
          docker image rm "docker.io/${{ vars.DOCKERHUB_PRODUCTION_IMAGE_REPOSITORY }}:${{ needs.container_pipeline.outputs.image_tag }}" || true
          docker image rm "docker.io/${{ vars.DOCKERHUB_PRODUCTION_IMAGE_REPOSITORY }}:latest" || true
          docker image prune -af || true

  notify:
    name: Pipeline Result Notification
    needs:
      [
        classify,
        trigger-integration-tests,
        container_pipeline,
        deploy,
        promote_to_production,
      ]
    if: ${{ always() }}
    runs-on: [self-hosted, linux, x64]
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_STAGING_BUILDS_URL }}
    steps:
      - name: Sanitize and validate Discord webhook
        run: |
          CLEAN="$(printf '%s' "$DISCORD_WEBHOOK" | tr -d '[:space:]"'"'"'')"
          case "$CLEAN" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*)
              echo "::add-mask::$CLEAN"
              echo "DISCORD_WEBHOOK=$CLEAN" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::warning::DISCORD_WEBHOOK is empty or not a valid Discord webhook URL (length=${#CLEAN}). Notifications will be skipped."
              echo "DISCORD_WEBHOOK=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Download Unit Test Report from Nexus
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          mkdir -p reports/unit-test
          curl -sS -f -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            -o reports/unit-test/unit-test-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/CredIssuer/reports/${{ github.event.repository.name }}/${{ github.run_id }}/unit-test-report.txt" || true

      - name: Download Trivy Report from Nexus
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          mkdir -p reports/trivy
          curl -sS -f -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            -o reports/trivy/trivy-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/CredIssuer/reports/${{ github.event.repository.name }}/${{ github.run_id }}/trivy-report.txt" || true

      - name: Determine outcome and send single Discord alert
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          TRIVY_STATUS="${{ needs.container_pipeline.outputs.trivy_status }}"
          GITLEAKS_STATUS="${{ needs.container_pipeline.outputs.gitleaks_status }}"

          FAILED_STAGE=""
          REASON=""

          if [ "${{ needs.trigger-integration-tests.result }}" = "failure" ]; then
            FAILED_STAGE="Unit Tests"
            REASON="Unit test pass percentage was below the required threshold."
          elif [ "${{ needs.container_pipeline.result }}" = "failure" ]; then
            FAILED_STAGE="Container Pipeline"
            if [ "$TRIVY_STATUS" = "FAILED" ]; then
              REASON="Trivy found actionable vulnerabilities in the image."
            elif [ "$GITLEAKS_STATUS" = "FAILED" ]; then
              REASON="Gitleaks detected a secret in the commit history."
            else
              REASON="Docker image build failed."
            fi
          elif [ "${{ needs.deploy.result }}" = "failure" ]; then
            FAILED_STAGE="Deploy To staging Server"
            REASON="Deployment failed, or rollout did not become healthy within the 5 minute timeout."
          elif [ "${{ needs.promote_to_production.result }}" = "failure" ]; then
            FAILED_STAGE="Promote To Production Registry"
            REASON="Retagging or pushing the release image failed."
          fi

          if [ -n "$FAILED_STAGE" ]; then
            CONTENT=$(cat <<EOF
          ❌ **Pipeline Failed**

          Repository : ${{ github.repository }}
          Branch/Tag : ${{ github.ref_name }}

          Failed at : ${FAILED_STAGE}
          Reason    : ${REASON}

          Triggered By : ${{ github.actor }}

          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
            )
            curl -sS -F "content=${CONTENT}" "$DISCORD_WEBHOOK" \
              || echo "::warning::Discord notification failed"
          else
            if [ "${{ needs.deploy.result }}" = "success" ]; then
              DEPLOY_STATUS="PASSED"
            else
              DEPLOY_STATUS="SKIPPED"
            fi

            UNIT_REPORT_STATUS="Not available"
            [ -f reports/unit-test/unit-test-report.txt ] && UNIT_REPORT_STATUS="Attached"

            TRIVY_REPORT_STATUS="Not available"
            [ -f reports/trivy/trivy-report.txt ] && TRIVY_REPORT_STATUS="Attached"

            CONTENT=$(cat <<EOF
          🚀 **Deployment Report**

          Repository : ${{ github.repository }}
          Branch/Tag : ${{ github.ref_name }}

          Deployment : ${DEPLOY_STATUS}

          Unit Test Report : ${UNIT_REPORT_STATUS}
          Trivy Report     : ${TRIVY_REPORT_STATUS}

          Triggered By : ${{ github.actor }}

          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
            )

            CURL_ARGS=(-sS -F "content=${CONTENT}")
            [ -f reports/unit-test/unit-test-report.txt ] && CURL_ARGS+=(-F "file1=@reports/unit-test/unit-test-report.txt")
            [ -f reports/trivy/trivy-report.txt ] && CURL_ARGS+=(-F "file2=@reports/trivy/trivy-report.txt")

            curl "${CURL_ARGS[@]}" "$DISCORD_WEBHOOK" \
              || echo "::warning::Discord notification failed"
          fi