name: Production Build and Deploy

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Enter branch name to build and deploy"
        required: true
        default: "main"
        type: string
      deploy_to_k8s:
        description: "Do you want to deploy to Kubernetes?"
        required: true
        default: false
        type: boolean

jobs:
  # ---------------------------------------------------------
  # UNIT TESTS
  # ---------------------------------------------------------
  trigger-unit-tests:
    name: Production Unit Tests
    uses: ./.github/workflows/unit-test.yml
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRODUCTION_BUILDS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}

  # ---------------------------------------------------------
  # BUILD + SECURITY SCANS + DOCKER PUSH
  # ---------------------------------------------------------
  container_pipeline:
    name: Production Container Pipeline
    needs:
      - trigger-unit-tests

    if: ${{ needs.trigger-unit-tests.result == 'success' }}

    uses: ./.github/workflows/container-pipeline.yml

    with:
      registry: harbor.gov.st
      image_repository: ${{ vars.HARBOR_PRODUCTION_IMAGE_REPOSITORY }}
      image_tag_prefix: prod
      docker_context: .
      dockerfile: Dockerfile
      fail_on_gitleaks: true
      max_image_layers: 35
      max_image_size_mb: 3500
      push_image: true

    secrets:
      registry_username: ${{ secrets.HARBOR_USERNAME }}
      registry_password: ${{ secrets.HARBOR_TOKEN }}
      discord_webhook: ${{ secrets.DISCORD_PRODUCTION_BUILDS_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
    

  # ---------------------------------------------------------
  # DEPLOY TO PRODUCTION k8s (only if deploy_to_k8s = true)
  # ---------------------------------------------------------
  deploy:
    name: Production Deploy To k8s

    needs:
      - trigger-unit-tests
      - container_pipeline

    if: >-
      ${{
        inputs.deploy_to_k8s == true &&
        needs.trigger-unit-tests.result == 'success' &&
        needs.container_pipeline.result == 'success'
      }}

    uses: ./.github/workflows/deploy-k8s.yml

    with:
      aws_region: ${{ vars.AWS_REGION }}
      aws_role_to_assume: ${{ vars.PRODUCTION_GITHUB_ACTIONS_AWS_ROLE_ARN }}
      eks_cluster_name: ${{ vars.PRODUCTION_EKS_CLUSTER_NAME }}
      kubernetes_namespace: ${{ vars.PRODUCTION_KUBERNETES_NAMESPACE }}
      docker_image: ${{ needs.container_pipeline.outputs.image_ref }}
      manifest_files: "deploy.yml"
      deployment_name_1: "inji-certify"
      container_name_1: "certify"
      manifest_dir: deploy/k8s/production
      unit_test_status: ${{ needs.trigger-unit-tests.outputs.test_status }}
      trivy_status: ${{ needs.container_pipeline.outputs.trivy_status }}
      use_aws_auth: false
      use_custom_kubeconfig: true
      kubeconfig_path: "/home/databck01/.kube/prod.conf"

    secrets:
      dockerhub_username: ${{ secrets.HARBOR_USERNAME }}
      dockerhub_token: ${{ secrets.HARBOR_TOKEN }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}

  # ---------------------------------------------------------
  # FINAL PIPELINE NOTIFICATION
  # ---------------------------------------------------------
  notify:
    name: Pipeline Result Notification

    needs:
      - trigger-unit-tests
      - container_pipeline
      - deploy

    if: ${{ always() }}

    runs-on: [self-hosted, linux, x64, stp-production]

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_PRODUCTION_BUILDS_URL }}
      DEPLOY_REQUESTED: ${{ inputs.deploy_to_k8s }}

    steps:
      - name: Download Unit Test Report from Nexus
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          mkdir -p reports/unit-test
          curl -sS -f \
            -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            -o reports/unit-test/unit-test-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/CredIssuer/reports/${{ github.event.repository.name }}/${{ github.run_id }}/unit-test-report.txt" \
            || true

      - name: Download Trivy Report from Nexus
        if: env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          mkdir -p reports/trivy
          curl -sS -f \
            -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            -o reports/trivy/trivy-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/CredIssuer/reports/${{ github.event.repository.name }}/${{ github.run_id }}/trivy-report.txt" \
            || true

      - name: Determine outcome and send single Discord alert
        if: env.DISCORD_WEBHOOK != ''
        run: |
          FAILED_STAGE=""
          REASON=""

          UNIT_TEST_RESULT="${{ needs.trigger-unit-tests.result }}"
          CONTAINER_RESULT="${{ needs.container_pipeline.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$DEPLOY_REQUESTED" = "true" ]; then
            MODE="Build & Deploy"
          else
            MODE="Build Only (k8s deploy skipped)"
            DEPLOY_RESULT="skipped (not requested)"
          fi

          if [ "$UNIT_TEST_RESULT" = "failure" ]; then
            FAILED_STAGE="Unit Tests"
            REASON="Unit test pass percentage was below the required threshold."
          elif [ "$CONTAINER_RESULT" = "failure" ]; then
            FAILED_STAGE="Container Pipeline"
            REASON="Build, Gitleaks, Trivy, or Docker push failed."
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            FAILED_STAGE="Deploy To k8s"
            REASON="Deployment failed, or rollout did not become healthy within the timeout."
          fi

          if [ -n "$FAILED_STAGE" ]; then
            CONTENT=$(cat <<EOF
          ❌ **Production ${MODE} Failed**

          **Repository** : ${{ github.repository }}
          **Branch** : ${{ inputs.branch }}
          **Failed Stage** : ${FAILED_STAGE}
          **Reason** : ${REASON}
          **Pipeline Status**
          Unit Tests       : ${UNIT_TEST_RESULT}
          Container Build  : ${CONTAINER_RESULT}
          Deploy To k8s    : ${DEPLOY_RESULT}

          **Triggered By** : ${{ github.actor }}
          🔗 ${RUN_URL}
          EOF
            )
          else
            CONTENT=$(cat <<EOF
          ✅ **Production ${MODE} Successful**

          **Repository** : ${{ github.repository }}
          **Branch** : ${{ inputs.branch }}

          **Pipeline Status**
          Unit Tests       : ${UNIT_TEST_RESULT}
          Container Build  : ${CONTAINER_RESULT}
          Deploy To k8s    : ${DEPLOY_RESULT}

          **Docker Image** : harbor.gov.st/${{ vars.HARBOR_PRODUCTION_IMAGE_REPOSITORY }}:${{ needs.container_pipeline.outputs.image_tag }}
          **Triggered By** : ${{ github.actor }}
          🔗 ${RUN_URL}
          EOF
            )
          fi

          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')

          curl -sS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"
