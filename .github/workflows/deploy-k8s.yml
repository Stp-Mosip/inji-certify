name: Deploy To k8s

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      aws_role_to_assume:
        required: true
        type: string
      eks_cluster_name:
        required: true
        type: string
      kubernetes_namespace:
        required: true
        type: string
      manifest_dir:
        required: true
        type: string
      manifest_files:
        description: "Space-separated manifest filenames inside manifest_dir to apply"
        required: false
        type: string
        default: "deployment.yaml"
      docker_image:
        required: true
        type: string
      deployment_name_1:
        required: false
        type: string
        default: payment-apis
      container_name_1:
        required: false
        type: string
        default: payment-apis
      unit_test_status:
        required: true
        type: string
      trivy_status:
        required: true
        type: string
      # --- New Toggle Inputs for AWS vs Custom Kubeconfig ---
      use_aws_auth:
        description: "Set to true to use AWS IAM role authentication"
        required: false
        type: boolean
        default: true
      use_custom_kubeconfig:
        description: "Set to true to use a custom kubeconfig file on the runner"
        required: false
        type: boolean
        default: false
      kubeconfig_path:
        description: "Path to the custom kubeconfig file if use_custom_kubeconfig is true"
        required: false
        type: string
        default: ""
    secrets:
      dockerhub_username:
        required: true
      dockerhub_token:
        required: true
      discord_webhook:
        required: false
      MINIO_ENDPOINT:
        required: true
      MINIO_ACCESS_KEY:
        required: true
      MINIO_SECRET_KEY:
        required: true
      MINIO_BUCKET:
        required: true


permissions:
  contents: read

jobs:
  deploy:
    name: Deploy To k8s
    runs-on: [self-hosted, linux, x64, stp-production]

    env:
      DISCORD_WEBHOOK: ${{ secrets.discord_webhook }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Explain deploy execution location
        run: |
          echo "This deploy job is running on the GitHub self-hosted runner."
          echo "kubectl and commands below execute directly from that runner."

      - name: Configure AWS credentials
        if: ${{ inputs.use_aws_auth == true }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          role-chaining: true

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubeconfig (AWS vs Custom)
        run: |
          if [ "${{ inputs.use_custom_kubeconfig }}" = "true" ]; then
            if [ -z "${{ inputs.kubeconfig_path }}" ]; then
              echo "::error::use_custom_kubeconfig is true, but kubeconfig_path is empty!"
              exit 1
            fi
            echo "Using custom kubeconfig path: ${{ inputs.kubeconfig_path }}"
            echo "KUBECONFIG=${{ inputs.kubeconfig_path }}" >> $GITHUB_ENV
          elif [ "${{ inputs.use_aws_auth }}" = "true" ]; then
            if [ -z "${{ inputs.aws_region }}" ] || [ -z "${{ inputs.eks_cluster_name }}" ]; then
              echo "::error::aws_region and eks_cluster_name are required when use_aws_auth is true!"
              exit 1
            fi
            echo "Using AWS IAM role and updating kubeconfig via aws eks update-kubeconfig..."
            aws eks update-kubeconfig \
              --name "${{ inputs.eks_cluster_name }}" \
              --region "${{ inputs.aws_region }}"
          else
            echo "::error::Neither AWS auth nor custom kubeconfig was selected!"
            exit 1
          fi

      - name: Verify cluster access
        id: verify_cluster
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Send EKS Access Failed Alert
        if: ${{ failure() && steps.verify_cluster.outcome == 'failure' && env.DISCORD_WEBHOOK != '' }}
        run: |
          CONTENT=$(cat <<EOF
          🚨 **CD - EKS Access Failed**
          Repository : ${{ github.repository }}
          Branch/Tag : ${{ github.ref_name }}
          Trigger    : ${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Auto' }}
          Runner     : Self-Hosted
          Cluster    : ${{ inputs.eks_cluster_name }}
          Namespace  : ${{ inputs.kubernetes_namespace }}
          Status     : ❌ FAILED
          Reason     : Runner could not access the EKS cluster.

          Run:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          curl \
            -F "content=${CONTENT}" \
            "$DISCORD_WEBHOOK"

      - name: Ensure namespace exists
        run: |
          kubectl get namespace "${{ inputs.kubernetes_namespace }}" >/dev/null 2>&1 || \
          kubectl create namespace "${{ inputs.kubernetes_namespace }}"

      - name: Apply Kubernetes manifests one by one
        run: |
          IFS=' ' read -ra files <<< "${{ inputs.manifest_files }}"

          for name in "${files[@]}"; do
            file="${{ inputs.manifest_dir }}/${name}"
            if [ -f "$file" ]; then
              echo "Applying $file"
              kubectl apply -f "$file"
            else
              echo "::warning::Manifest file not found, skipped: $file"
            fi
          done

      - name: Update deployment_name_1 image
        run: |
          kubectl set image deployment/${{ inputs.deployment_name_1 }} \
            ${{ inputs.container_name_1 }}=${{ inputs.docker_image }} \
            --namespace "${{ inputs.kubernetes_namespace }}"

      - name: Wait for deployment_name_1 rollout
        run: |
          kubectl rollout status deployment/${{ inputs.deployment_name_1 }} \
            --namespace "${{ inputs.kubernetes_namespace }}" \
            --timeout=300s

      # ------------------------------------------------
      # SETUP MINIO CLIENT (used by report download steps)
      # ------------------------------------------------
      - name: Setup MinIO Client
        if: always()
        continue-on-error: true
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          # Use mc if already installed on the runner, otherwise download it
          if ! command -v mc >/dev/null 2>&1; then
            curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$RUNNER_TEMP/mc"
            chmod +x "$RUNNER_TEMP/mc"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP:$PATH"
          fi

          # Add --insecure here (and in the mc cp steps) if MinIO uses a self-signed certificate
          mc alias set cicd "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"

      - name: Download Unit Test Report from MinIO
        if: always()
        continue-on-error: true
        env:
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          mkdir -p reports/unit-test
          mc cp \
            "cicd/${MINIO_BUCKET}/reports/${{ github.event.repository.name }}/${{ github.run_id }}/unit-test-report.txt" \
            reports/unit-test/unit-test-report.txt || true

      - name: Download Trivy Report from MinIO
        if: always()
        continue-on-error: true
        env:
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          mkdir -p reports/trivy
          mc cp \
            "cicd/${MINIO_BUCKET}/reports/${{ github.event.repository.name }}/${{ github.run_id }}/trivy-report.txt" \
            reports/trivy/trivy-report.txt || true

      - name: Show deployment summary
        run: |
          kubectl get deploy,po,svc \
            --namespace "${{ inputs.kubernetes_namespace }}"

      - name: Send Final Deployment Report
        if: always() && env.DISCORD_WEBHOOK != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            DEPLOY_STATUS="PASSED"
            DEPLOY_EMOJI="✅"
          else
            DEPLOY_STATUS="FAILED"
            DEPLOY_EMOJI="❌"
          fi

          # Check Unit Test report
          if [ -f reports/unit-test/unit-test-report.txt ]; then
            UNIT_REPORT_STATUS="📎 Attached"
          else
            UNIT_REPORT_STATUS="❌ Not available"
          fi

          # Check Trivy report
          if [ -f reports/trivy/trivy-report.txt ]; then
            TRIVY_REPORT_STATUS="📎 Attached"
          else
            TRIVY_REPORT_STATUS="❌ Not available"
          fi

          CONTENT=$(cat <<EOF
          🚀 **Deployment Report**

          Repository : ${{ github.repository }}
          Branch/Tag : ${{ github.ref_name }}

          Cluster    : ${{ inputs.eks_cluster_name }}
          Namespace  : ${{ inputs.kubernetes_namespace }}

          Deployment : ${DEPLOY_EMOJI} ${DEPLOY_STATUS}

          Unit Tests : ${{ inputs.unit_test_status }}
          Trivy      : ${{ inputs.trivy_status }}

          Unit Test Report : ${UNIT_REPORT_STATUS}
          Trivy Report     : ${TRIVY_REPORT_STATUS}

          Triggered By : ${{ github.actor }}
          Runner       : Self-Hosted

          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

          CURL_ARGS=(
            -sS
            --fail-with-body
            -F "content=${CONTENT}"
          )

          # Attach Unit Test Report
          if [ -f reports/unit-test/unit-test-report.txt ]; then
            echo "Attaching unit test report..."
            CURL_ARGS+=(
              -F "file1=@reports/unit-test/unit-test-report.txt"
            )
          fi

          # Attach Trivy Report ONLY if it exists
          if [ -f reports/trivy/trivy-report.txt ]; then
            echo "Attaching Trivy report..."
            CURL_ARGS+=(
              -F "file2=@reports/trivy/trivy-report.txt"
            )
          else
            echo "Trivy report not found. This is expected when Trivy passed."
          fi

          echo "Sending final deployment notification..."

          curl "${CURL_ARGS[@]}" "$DISCORD_WEBHOOK" || {
            echo "⚠️ Discord notification failed"
            echo "Deployment status remains: ${DEPLOY_STATUS}"
            exit 0
          }